services:
  - type: web
    name: attendance-portal
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install psycopg2-binary"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # Supabase Postgres URL yahan paste karna
