{% extends "base.html" %}
{% block title %}Change password · Attendance Portal{% endblock %}
{% block content %}
<div class="page-head">
  <div class="titles">
    <h1>Change password</h1>
    <div class="subtitle">Use at least 6 characters. You will stay signed in.</div>
  </div>
</div>

<div class="card narrow">
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="cur">Current password</label>
    <input id="cur" type="password" name="current_password" required autocomplete="current-password">

    <label for="new">New password</label>
    <input id="new" type="password" name="new_password" required minlength="6" autocomplete="new-password">
    <div class="hint">Minimum 6 characters. Avoid your name or Emp ID.</div>

    <label for="conf">Confirm new password</label>
    <input id="conf" type="password" name="confirm_password" required minlength="6" autocomplete="new-password">

    <div class="form-actions">
      <button class="btn green" type="submit">
        <svg aria-hidden="true"><use href="#i-check"/></svg>Save new password
      </button>
    </div>
  </form>
</div>
{% endblock %}
