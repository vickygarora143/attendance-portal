{% extends "base.html" %}
{% block content %}
<h1>🔑 Change Password</h1>
<div class="card" style="max-width:420px">
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password</label>
    <input type="password" name="current_password" required autocomplete="current-password">
    <label style="margin-top:10px">New password (min 6 characters)</label>
    <input type="password" name="new_password" required minlength="6" autocomplete="new-password">
    <label style="margin-top:10px">Confirm new password</label>
    <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
    <button class="btn green" type="submit" style="margin-top:14px;width:100%">Save New Password</button>
  </form>
</div>
{% endblock %}
