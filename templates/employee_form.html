{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit' if emp else 'Add' }} Employee</h1>
<div class="card" style="max-width:760px">
  <form method="post">
    <div class="form-row">
      <div><label>Employee (Device) ID *</label><input name="emp_id" value="{{ emp.emp_id if emp }}" required></div>
      <div><label>Name *</label><input name="name" value="{{ emp.name if emp }}" required></div>
      <div><label>Designation</label><input name="designation" value="{{ emp.designation if emp }}"></div>
    </div>
    <div class="form-row">
      <div><label>Zone / Portfolio</label><input name="zone" value="{{ emp.zone if emp }}"></div>
      <div><label>Product</label><input name="product" value="{{ emp.product if emp }}"></div>
      <div><label>Mobile</label><input name="mobile" value="{{ emp.mobile if emp }}"></div>
    </div>
    <div class="form-row">
      <div><label>DOJ</label><input type="date" name="doj" value="{{ emp.doj if emp }}"></div>
      <div><label>Gross Salary</label><input type="number" step="0.01" name="gross" value="{{ emp.gross if emp }}"></div>
      <div><label>Status</label><input name="status" value="{{ emp.status if emp else 'ACTIVE' }}"></div>
    </div>
    <h2 style="margin-top:16px">Salary (admin-only — never shown to agents)</h2>
    <div class="form-row">
      <div><label>Payable Days</label><input type="number" step="0.5" name="payable_days" value="{{ emp.payable_days if emp }}"></div>
      <div><label>Payable Salary</label><input type="number" step="0.01" name="payable_salary" value="{{ emp.payable_salary if emp }}"></div>
      <div><label>Incentive</label><input type="number" step="0.01" name="incentive" value="{{ emp.incentive if emp else 0 }}"></div>
    </div>
    <div class="form-row">
      <div><label>Cash Prize</label><input type="number" step="0.01" name="cash_prize" value="{{ emp.cash_prize if emp else 0 }}"></div>
      <div><label>TL Incentive</label><input type="number" step="0.01" name="tl_incentive" value="{{ emp.tl_incentive if emp else 0 }}"></div>
      <div><label>Arrear</label><input type="number" step="0.01" name="arrear" value="{{ emp.arrear if emp else 0 }}"></div>
    </div>
    <div class="form-row">
      <div><label>Deduction</label><input type="number" step="0.01" name="deduction" value="{{ emp.deduction if emp else 0 }}"></div>
      <div><label>Final Payable</label><input type="number" step="0.01" name="final_payable" value="{{ emp.final_payable if emp }}"></div>
    </div>
    <label style="margin-top:12px"><input type="checkbox" name="device_enrolled" {{ 'checked' if not emp or emp.device_enrolled }}> Enrolled on biometric device</label>
    <br><br><button class="btn green">💾 Save</button>
    <a class="btn grey" href="{{ url_for('admin.employees') }}">Cancel</a>
  </form>
</div>
{% endblock %}
