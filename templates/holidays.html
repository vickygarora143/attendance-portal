{% extends "base.html" %}
{% block content %}
<h1>🎄 Holidays — {{ off.name }}</h1>
<div class="card" style="max-width:520px">
  <form method="post" class="form-row">
    <div><label>Date</label><input type="date" name="hdate" required></div>
    <div><label>Name</label><input name="name" placeholder="Gandhi Jayanti"></div>
    <div style="align-self:flex-end"><button class="btn green">+ Add</button></div>
  </form>
  <p class="muted">If the device shows A on a holiday, it is counted as HO (paid off).</p>
</div>
<div class="card">
  <table><tr><th>Date</th><th>Name</th><th></th></tr>
  {% for h in hols %}
    <tr><td>{{ h.hdate.strftime('%d-%b-%Y') }}</td><td>{{ h.name }}</td>
      <td><form method="post"><input type="hidden" name="delete_id" value="{{ h.id }}">
        <button class="btn sm red">Delete</button></form></td></tr>
  {% else %}<tr><td colspan="3" class="muted">No holidays added.</td></tr>{% endfor %}
  </table>
</div>
{% endblock %}
