{% extends "base.html" %}
{% block content %}
<div style="max-width:400px;margin:7vh auto 0;">
  <div class="card" style="padding:28px 26px">
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:40px">📅</div>
      <h1 style="margin:6px 0 2px">Attendance Portal</h1>
      <div class="muted">Login with your credentials</div>
    </div>
    <form method="post">
      <label>Username</label>
      <input name="username" style="width:100%" autofocus required placeholder="e.g. GDSM015" autocapitalize="characters" autocomplete="username">
      <label>Password</label>
      <input name="password" type="password" style="width:100%" required>
      <br><br><button class="btn" style="width:100%;padding:12px">Login</button>
    </form>
  </div>
</div>
{% endblock %}
