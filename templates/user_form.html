{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit' if u else 'Add' }} User</h1>
<div class="card" style="max-width:640px">
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div><label>Username *</label><input name="username" value="{{ u.username if u }}" required></div>
      <div><label>Password {{ '(blank = no change)' if u else '*' }}</label>
        <input name="password" type="password"></div>
    </div>
    <div class="form-row">
      <div><label>Role</label>
        <select name="role">
          {% for r in ['agent', 'admin', 'super_admin'] %}
            <option value="{{ r }}" {{ 'selected' if u and u.role == r }}>{{ r }}</option>
          {% endfor %}
        </select></div>
      <div><label>Office (agents/admins ke liye)</label>
        <select name="office_id"><option value="">—</option>
          {% for o in offs %}<option value="{{ o.id }}" {{ 'selected' if u and u.office_id == o.id }}>{{ o.code }}</option>{% endfor %}
        </select></div>
    </div>
    <div class="form-row">
      <div><label>Link Employee (agent ke liye)</label>
        <select name="employee_id"><option value="">—</option>
          {% for e in emps %}<option value="{{ e.id }}" {{ 'selected' if u and u.employee_id == e.id }}>{{ e.emp_id }} — {{ e.name }}</option>{% endfor %}
        </select></div>
      <div style="align-self:flex-end;padding-top:6px">
        <label style="margin:0;display:flex;align-items:center;gap:6px">
          <input type="checkbox" name="active" {{ 'checked' if not u or u.active }} style="width:auto"> Active</label></div>
    </div>
    <br><button class="btn green">💾 Save User</button>
    <a class="btn grey" href="{{ url_for('super.users') }}">Cancel</a>
  </form>
</div>
{% endblock %}
