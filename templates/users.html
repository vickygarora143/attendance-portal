{% extends "base.html" %}
{% block content %}
<h1>👤 Users <a class="btn sm green" style="float:right" href="{{ url_for('super.user_form') }}">+ Add User</a></h1>
<div class="card">
  <table><tr><th>Username</th><th>Role</th><th>Office</th><th>Employee</th><th>Active</th><th></th></tr>
  {% for u in us %}
    <tr><td>{{ u.username }}</td><td>{{ u.role }}</td>
      <td>{{ u.office.code if u.office else '—' }}</td>
      <td>{{ u.employee.name if u.employee else '—' }}</td>
      <td>{{ '✓' if u.active else '✗' }}</td>
      <td><a class="btn sm" href="{{ url_for('super.user_form', uid=u.id) }}">Edit</a></td></tr>
  {% endfor %}
  </table>
</div>
{% endblock %}
